name: Release Drafter

on:
  push:
    branches:
      - main

# Rapid successive pushes queue instead of overlapping.
concurrency:
  group: release-drafter
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update_release_draft:
    permissions:
      # write permission is required to push the version bump/tag and create a github release
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # full history is required to inspect the full commit range of the push
          fetch-depth: 0

      - name: Check for [release] marker
        id: release_gate
        run: |
          HEAD_MSG=$(git log -1 --format=%s)
          echo "HEAD commit message: $HEAD_MSG"
          if printf '%s\n' "$HEAD_MSG" | grep -q '\[release\]'; then
            echo "RELEASE_REQUESTED=true" >> "$GITHUB_OUTPUT"
            echo "::notice::[release] marker found - proceeding with release"
          else
            echo "RELEASE_REQUESTED=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No [release] marker in HEAD commit - skipping release"
          fi

      - name: Determine version bump from full push range
        id: version_bump
        if: steps.release_gate.outputs.RELEASE_REQUESTED == 'true'
        run: |
          echo "before=${{ github.event.before }}"
          echo "after=${{ github.event.after }}"

          # Collect every commit message in the pushed range (before..after).
          # Falls back to the HEAD commit message for the first push to main.
          COMMITS=$(git log --format=%B "${{ github.event.before }}..${{ github.event.after }}" 2>/dev/null || true)
          if [ -z "$COMMITS" ]; then
            COMMITS=$(git log -1 --format=%B)
          fi
          LOWER=$(printf '%s' "$COMMITS" | tr '[:upper:]' '[:lower:]')

          # Get current version
          CURRENT_VERSION=$(grep "versionName" app/build.gradle | sed 's/.*versionName "\(.*\)"/\1/')
          CURRENT_VERSION_CODE=$(grep "versionCode" app/build.gradle | sed 's/.*versionCode \([0-9]*\)/\1/')

          # Parse current version
          IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION"
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}

          # Determine bump type from the HIGHEST severity across all commits in the range:
          # major > minor > patch
          if printf '%s' "$LOWER" | grep -qE '\b(breaking|major)\b'; then
            NEW_MAJOR=$((MAJOR + 1))
            NEW_MINOR=0
            NEW_PATCH=0
            BUMP_TYPE="major"
          elif printf '%s' "$LOWER" | grep -qE '\b(feat|feature|enhancement)\b'; then
            NEW_MAJOR=$MAJOR
            NEW_MINOR=$((MINOR + 1))
            NEW_PATCH=0
            BUMP_TYPE="minor"
          else
            # Default to patch
            NEW_MAJOR=$MAJOR
            NEW_MINOR=$MINOR
            NEW_PATCH=$((PATCH + 1))
            BUMP_TYPE="patch"
          fi

          NEW_VERSION="$NEW_MAJOR.$NEW_MINOR.$NEW_PATCH"
          # Calculate versionCode based on semantic version to maintain consistency
          # Format: major * 10000 + minor * 100 + patch
          NEW_VERSION_CODE=$((NEW_MAJOR * 10000 + NEW_MINOR * 100 + NEW_PATCH))

          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "current_version_code=$CURRENT_VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_version_code=$NEW_VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "bump_type=$BUMP_TYPE" >> "$GITHUB_OUTPUT"
          echo "Detected bump type: $BUMP_TYPE -> $NEW_VERSION (versionCode $NEW_VERSION_CODE)"

      - name: Update build.gradle with new version
        if: steps.release_gate.outputs.RELEASE_REQUESTED == 'true'
        run: |
          CURRENT_VERSION="${{ steps.version_bump.outputs.current_version }}"
          NEW_VERSION="${{ steps.version_bump.outputs.new_version }}"
          CURRENT_VERSION_CODE="${{ steps.version_bump.outputs.current_version_code }}"
          NEW_VERSION_CODE="${{ steps.version_bump.outputs.new_version_code }}"

          # Update versionName
          sed -i "s/versionName \"$CURRENT_VERSION\"/versionName \"$NEW_VERSION\"/" app/build.gradle

          # Update versionCode
          sed -i "s/versionCode $CURRENT_VERSION_CODE/versionCode $NEW_VERSION_CODE/" app/build.gradle

          echo "Updated version from $CURRENT_VERSION to $NEW_VERSION"
          echo "Updated versionCode from $CURRENT_VERSION_CODE to $NEW_VERSION_CODE"

      - name: Commit version bump
        if: steps.release_gate.outputs.RELEASE_REQUESTED == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add app/build.gradle
          git commit -m "chore: bump version to ${{ steps.version_bump.outputs.new_version }} [skip ci]"
          git push origin main

      - name: Create git tag
        if: steps.release_gate.outputs.RELEASE_REQUESTED == 'true'
        run: |
          git tag v${{ steps.version_bump.outputs.new_version }}

      - name: Push git tag
        if: steps.release_gate.outputs.RELEASE_REQUESTED == 'true'
        run: |
          git push origin v${{ steps.version_bump.outputs.new_version }}

      - name: Set up JDK 17
        if: steps.release_gate.outputs.RELEASE_REQUESTED == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        if: steps.release_gate.outputs.RELEASE_REQUESTED == 'true'
        run: chmod +x gradlew

      - name: Run tests and lint
        if: steps.release_gate.outputs.RELEASE_REQUESTED == 'true'
        run: |
          ./gradlew test
          ./gradlew lintDebug

      - name: Create keystore from secrets
        if: steps.release_gate.outputs.RELEASE_REQUESTED == 'true'
        run: |
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 -d > app/qiblafinder-release-key.jks

      - name: Build release APK
        if: steps.release_gate.outputs.RELEASE_REQUESTED == 'true'
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Create draft Release with APK
        if: steps.release_gate.outputs.RELEASE_REQUESTED == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/app-release.apk
          name: Release v${{ steps.version_bump.outputs.new_version }}
          tag_name: v${{ steps.version_bump.outputs.new_version }}
          draft: true
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
